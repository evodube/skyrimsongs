; SkyrimSongs settings. Most can be changed in game with SKSE Menu Framework (Mod Control Panel > Skyrim Songs).

[Play]
Hotkey = 0x2B            ; take out your instrument, put it away, close the songbook (DirectInput scan code: 0x2B = \). Can be changed in game: SKSE Menu Framework > Skyrim Songs > Change...
RequireInstrument = 1    ; you need a lute or flute in your pack (0: play without one)
ThirdPerson = 1          ; switch to third person while you play, and back after
MuteGameMusic = 1        ; quiet the game's music while you play
MusicCategory = Music    ; the sound category the game's music is in (its name in Settings > Audio; translate it if your game isn't in English)
Volume = 0.90            ; the instruments (0 - 2)
Reverb = 0.16            ; room echo (0 - 1)
Speed = 1.00             ; how fast songs play (0.5 - 2.0; 1 = as written)
UiScale = 1.00
ShowKeyboard = 1         ; the key guide at the bottom of the screen
SongSort = 0             ; the songbook's order: 0 name, 1 length, 2 notes, 3 most played, 4 newest (favourites always first)
SongbookX = 0.5          ; where the songbook sits (its middle, as a share of the screen); drag it in game to change these
SongbookY = 0.45
HideHud = 0              ; play with nothing on screen, for immersion (Backspace while playing toggles it)

[Crowd]
ListenRange = 700        ; how far you can be heard (game units; 70 is about a metre: 700 is about 10 m)
TipRate = 1.00           ; how often happy listeners tip
TipSize = 1.00           ; how much they give
MaxTipPerListener = 40   ; most one person gives you (each person tips once a day)
Patience = 1.00          ; how quickly a bad set turns the room (higher = quicker)
ThrowOut = 1             ; a hostile crowd in an inn gets you thrown out, and you can't play there again that day
SpeechXP = 0.50          ; Speech experience per septim earned
Reactions = 1            ; listeners clap, dance, drink, hand over their tip, scratch their heads
MaxVisitors = 4          ; happy listeners who come over to stand in front of you while you play (0-4)

[Animation]
; the idles played while you perform, as form IDs in Skyrim.esm. 0 = the game's own bard idles, which put the
; instrument in your hands (lute 0x96F8D, flute 0x96F8C; put away with IdleStop_Loose 0x10D9EE)
LuteIdle = 0
FluteIdle = 0
StopIdle = 0

[Display]
UpscalerFix = 1          ; with an upscaler (Skyrim Upscaler, DLSS/FSR via dynamic resolution), draw the interface to match its render scale.
                         ; Set to 0 if the interface comes out shrunk into the top-left corner.

[Debug]
LogInput = 0
